<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
<title id="t">Pacify measuring running cadence</title>
<desc id="d">An accelerometer trace is compared with a copy of itself shifted by 11 to 26 samples. The average difference for each shift is drawn as a bar. The shortest bar, at a shift of about 17.4 samples, is the stride period, which Pacify reports as 173 steps per minute with 28% confidence. Then the app pauses for 15 seconds before the next 256-sample window.</desc>
<style>:root{--bg:#F4F1FB;--ink:#21173A;--muted:#6B6384;--grid:#DCD4EE;--signal:#673AB7;--copy:#C7820A;--match:#0C9A89;--bar:#B7A6DE;--bar-out:#DED6EF}@media (prefers-color-scheme:dark){:root{--bg:#1A1430;--ink:#F1ECFF;--muted:#A79FC2;--grid:#302853;--signal:#B59AF5;--copy:#F2B84B;--match:#3FD8C2;--bar:#5E4C96;--bar-out:#382D5F}}text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}.m{fill:var(--muted);font-size:13px}.cap{font-size:14px;font-weight:600}.trace{fill:none;stroke:var(--signal);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0}.copy{fill:none;stroke:var(--copy);stroke-width:2;stroke-linejoin:round;stroke-dasharray:5 4;opacity:0}.copym{fill:none;stroke:var(--match);stroke-width:2.2;stroke-linejoin:round}.ghost{transform:translateX(104.2px)}.bar{fill:var(--bar)} .bar.o{fill:var(--bar-out)} .hit{fill:var(--match)}.cur{stroke:var(--ink);stroke-width:1.5;opacity:1;transform:translateX(238.6px)}.num{font-size:92px;font-weight:750;letter-spacing:-3px;font-variant-numeric:tabular-nums}.seg{fill:var(--bar-out)} .seg.on{fill:var(--signal)} .segp.on{fill:var(--match)}.anim .trace{animation:draw 12s linear infinite both}.anim .ghost{animation:sweep 12s infinite both}.anim .copy{animation:copyfade 12s infinite both}.anim .copym{animation:matchfade 12s infinite both}.anim .cur{animation:cur 12s infinite both}.anim .hit{animation:matchfade 12s infinite both}.anim .num,.anim .unit{animation:read 12s infinite both}.anim .seg.on{animation:segm 12s infinite both}.anim .segp.on{animation:segp 12s infinite both}.anim .data{animation:clear 12s infinite both}@keyframes draw{0%,1.67%{stroke-dashoffset:1}15.00%,100%{stroke-dashoffset:0}}@keyframes sweep{0%,20.00%{transform:translateX(66px);animation-timing-function:linear}58.33%{transform:translateX(156px);animation-timing-function:cubic-bezier(.45,0,.2,1)}65.00%,100%{transform:translateX(104.2px)}}@keyframes cur{0%,20.00%{transform:translateX(0);opacity:0;animation-timing-function:linear}21.25%{opacity:1}58.33%{transform:translateX(562.5px);animation-timing-function:cubic-bezier(.45,0,.2,1)}65.00%{transform:translateX(238.6px);opacity:1}78.33%,100%{transform:translateX(238.6px);opacity:0}}@keyframes copyfade{0%,15.00%{opacity:0}18.33%,67.50%{opacity:1}70.00%,100%{opacity:0}}@keyframes matchfade{0%,67.50%{opacity:0}70.00%,100%{opacity:1}}@keyframes read{0%,67.50%{opacity:.28}70.42%,100%{opacity:1}}@keyframes segm{0%,78.33%{opacity:1}80.00%,99.17%{opacity:0}100%{opacity:1}}@keyframes segp{0%,78.33%{opacity:0}80.00%,99.17%{opacity:1}100%{opacity:0}}@keyframes clear{0%,94.17%{opacity:1}99.17%,100%{opacity:0}}.anim .b11{animation:b11 12s infinite both}@keyframes b11{0%,19.58%{transform:scaleY(0)}22.08%,100%{transform:scaleY(1)}}.anim .b12{animation:b12 12s infinite both}@keyframes b12{0%,22.14%{transform:scaleY(0)}24.64%,100%{transform:scaleY(1)}}.anim .b13{animation:b13 12s infinite both}@keyframes b13{0%,24.69%{transform:scaleY(0)}27.19%,100%{transform:scaleY(1)}}.anim .b14{animation:b14 12s infinite both}@keyframes b14{0%,27.25%{transform:scaleY(0)}29.75%,100%{transform:scaleY(1)}}.anim .b15{animation:b15 12s infinite both}@keyframes b15{0%,29.81%{transform:scaleY(0)}32.31%,100%{transform:scaleY(1)}}.anim .b16{animation:b16 12s infinite both}@keyframes b16{0%,32.36%{transform:scaleY(0)}34.86%,100%{transform:scaleY(1)}}.anim .b17{animation:b17 12s infinite both}@keyframes b17{0%,34.92%{transform:scaleY(0)}37.42%,100%{transform:scaleY(1)}}.anim .b18{animation:b18 12s infinite both}@keyframes b18{0%,37.47%{transform:scaleY(0)}39.97%,100%{transform:scaleY(1)}}.anim .b19{animation:b19 12s infinite both}@keyframes b19{0%,40.03%{transform:scaleY(0)}42.53%,100%{transform:scaleY(1)}}.anim .b20{animation:b20 12s infinite both}@keyframes b20{0%,42.58%{transform:scaleY(0)}45.08%,100%{transform:scaleY(1)}}.anim .b21{animation:b21 12s infinite both}@keyframes b21{0%,45.14%{transform:scaleY(0)}47.64%,100%{transform:scaleY(1)}}.anim .b22{animation:b22 12s infinite both}@keyframes b22{0%,47.69%{transform:scaleY(0)}50.19%,100%{transform:scaleY(1)}}.anim .b23{animation:b23 12s infinite both}@keyframes b23{0%,50.25%{transform:scaleY(0)}52.75%,100%{transform:scaleY(1)}}.anim .b24{animation:b24 12s infinite both}@keyframes b24{0%,52.81%{transform:scaleY(0)}55.31%,100%{transform:scaleY(1)}}.anim .b25{animation:b25 12s infinite both}@keyframes b25{0%,55.36%{transform:scaleY(0)}57.86%,100%{transform:scaleY(1)}}.anim .b26{animation:b26 12s infinite both}@keyframes b26{0%,57.92%{transform:scaleY(0)}60.42%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}.anim .segm-static{display:none}</style>
